# Burner's Utilities rope kits (format 3).
# One section per rope kit, named by the kit's ID (the text in its ID FSM, set in the kit's SigmaMod .json).
# Delete this file to get the shipped values back. Changes apply to ropes tied after the file is saved.
#
#   name                what the kit's instructions call it
#   breaking_strength   kN: the pull that snaps it
#   stretch             %: how much it has stretched when it snaps (sets its stiffness; it stretches in proportion)
#   thickness           m: its diameter, as drawn
#   texture             a game texture, by name, drawn along the rope (none: drawn plain, in `color`)
#   band                pixel rows of that texture (counted from the top) that hold one strand of rope, from, to
#   metallic            0 - 1
#   smoothness          0 - 1
#   color               r, g, b (0 - 1): the colour when there is no texture
#   bore                m: the inside diameter of a hose. A kit with a bore ties hoses: tied between two liquid
#                       containers holding the same liquid, it runs from the one whose surface is higher.
#
# The texture repeats along the rope so that the strand keeps its proportions at that thickness.
#
# [liquid: <tag>] sections: what a hose carries, by the tag the game gives a container of it.
#   viscosity           m2/s: kinematic viscosity, at about 20 C (sets how fast it runs through a hose)
#   sound               a game sound, by name, looped at the hose's outlet while it runs
# A liquid not listed runs like water and sounds like the game's fuel can.

# 12 mm three-strand polyester
[RopeTools]
name = Fibre rope
breaking_strength = 30
stretch = 15
thickness = 0.012
texture = rope_cable
band = 0, 41
metallic = 0
smoothness = 0.1

# 12 mm 6x19 IWRC steel wire rope, grade 1770
[SteelCableTools]
name = Steel cable
breaking_strength = 93
stretch = 2
thickness = 0.012
texture = rope_cable
band = 82, 113
metallic = 0.6
smoothness = 0.35

# 19 mm (3/4") bore PVC hose, 25 mm outside; tears at about 50 kg
[HoseTools]
name = Hose
breaking_strength = 0.5
stretch = 50
thickness = 0.025
color = 0.12, 0.12, 0.11
metallic = 0
smoothness = 0.45
bore = 0.019

[liquid: Gasoline]
viscosity = 0.0000006
sound = liquid_filling2

[liquid: Diesel]
viscosity = 0.000003
sound = liquid_filling2

[liquid: Water]
viscosity = 0.000001
sound = liquid_filling2

# 10W-30
[liquid: MotorOil]
viscosity = 0.00015
sound = oil_canister_pouring_1
